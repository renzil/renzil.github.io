---
layout: portfolio-page
---

<article class="project-page-content">
	<section class="portfolio-page-intro">
		<p class="prompt">~/renzil/projects/{{ page.title | slugify }}</p>
		<p class="meta">{{ page.date | date: "%Y" }} · {% for label in page.labels %}{{ label }}{% unless forloop.last %} · {% endunless %}{% endfor %}</p>
		<h1>{{ page.title }}</h1>
		<p class="lead">{{ page.summary }}</p>
	</section>
	<section class="portfolio-section project-body">
		{{ content }}
	</section>
</article>
